<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Chaveamento de Magic · DNTAB</title>
<meta name="description" content="Monte e conduza torneios de Magic: 1x1 ou pods de Commander, eliminação simples, dupla ou todos contra todos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1e8;--panel:#fffdf8;--card:#ffffff;--ink:#1f1b16;--muted:#6f675b;--line:#e2d9c8;
  --accent:#a4471f;--accent-ink:#ffffff;--accent-soft:#f6e3d6;--win:#f3e2d6;--ready:#2f6f4f;--ready-soft:#e3f1e8;
  --shadow:0 1px 2px rgba(40,30,15,.06),0 4px 14px rgba(40,30,15,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f;--panel:#1d1a15;--card:#231f19;--ink:#efe8dc;--muted:#a69d8e;--line:#3a342b;
  --accent:#e08a5c;--accent-ink:#1a120c;--accent-soft:#3a271c;--win:#3b2a20;--ready:#7cc49c;--ready-soft:#1f3328;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#15130f;--panel:#1d1a15;--card:#231f19;--ink:#efe8dc;--muted:#a69d8e;--line:#3a342b;
  --accent:#e08a5c;--accent-ink:#1a120c;--accent-soft:#3a271c;--win:#3b2a20;--ready:#7cc49c;--ready-soft:#1f3328;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:20px;letter-spacing:.02em;color:var(--ink);text-decoration:none;cursor:pointer}
.brand span{color:var(--accent)}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0 0 6px}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:20px;margin:0 0 12px}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{background:#3a1d1a;color:#f2b8b5}}
.saved{display:flex;flex-direction:column;gap:10px}

.col{min-width:200px;max-width:240px;flex:0 0 auto;display:flex;flex-direction:column;gap:10px}

.card .id{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:5px 9px;border-bottom:1px solid var(--line)}

.card .foot{border-top:1px solid var(--line);padding:4px 6px;display:flex;justify-content:flex-end}
.link{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:3px}

table.cls th,table.cls td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;font-size:14px}

table.cls tr:first-child+tr td{font-weight:700}
.tblwrap{overflow-x:auto}
details.sorteio{margin-top:8px;font-size:14px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;font-size:14px;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{margin-top:40px;color:var(--muted);font-size:13px;text-align:center}
.help{font-size:13px;color:var(--muted);margin-top:4px}
@media print{.toolbar,.prontas,header.top,footer,.foot{display:none!important}body{background:#fff}.board{overflow:visible;flex-wrap:wrap}}

<body>
<div class="wrap">
  <header class="top">
    <a class="brand" data-act="home">dntab<span>.</span>chave</a>
  </header>
  <main id="app"></main>
  <footer>dntab.com.br · os torneios ficam salvos neste navegador</footer>
</div>
<div class="toast" id="toast"></div>

<script>
// ==LOGIC START==
const BYE = "BYE";
class ErroChave extends Error {}
function erro(m) { throw new ErroChave(m); }

// ---------- sorteio com seed (reproduzível) ----------
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
}
function mulberry32(a) {
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function Rng(seed) {
  const r = mulberry32(xmur3(String(seed))());
  return { shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; } };
}

// ---------- pods ----------
function tamanhosPods(n) {
  if (n < 2) erro("Pods precisam de pelo menos 2 jogadores.");
  if (n <= 5) return [n];
  const k = Math.ceil(n / 4), tres = 4 * k - n;
  return Array(k - tres).fill(4).concat(Array(tres).fill(3));
}
const chavePar = (a, b) => [a, b].sort().join("|");
function montarPods(jogadores, rng, encontros, tentativas = 3000) {
  const tam = tamanhosPods(jogadores.length);
  let melhor = null, custoMin = Infinity;
  for (let x = 0; x < tentativas; x++) {
    const p = rng.shuffle(jogadores.slice());
    const pods = []; let i = 0;
    for (const t of tam) { pods.push(p.slice(i, i + t)); i += t; }
    let custo = 0;
    for (const pod of pods) for (let a = 0; a < pod.length; a++) for (let b = a + 1; b < pod.length; b++) custo += encontros[chavePar(pod[a], pod[b])] || 0;
    if (custo < custoMin) { melhor = pods; custoMin = custo; }
    if (custo === 0) break;
  }
  for (const pod of melhor) for (let a = 0; a < pod.length; a++) for (let b = a + 1; b < pod.length; b++) {
    const k = chavePar(pod[a], pod[b]); encontros[k] = (encontros[k] || 0) + 1;
  }
  return melhor;
}

// ---------- 1x1 eliminação ----------
function ordemSeeds(tam) {
  let o = [1, 2];
  while (o.length < tam) { const m = 2 * o.length + 1; o = o.flatMap(s => [s, m - s]); }
  return o;
}
const log2c = n => Math.max(1, Math.ceil(Math.log2(n)));
// Rodadas pedidas → tamanho da chave. Mais rodadas = mais vagas (vitórias automáticas);
// uma a menos = a 1ª rodada vira preliminar (só os últimos sorteados jogam para entrar).
function tamanhoChave(n, R) {
  const k0 = log2c(n);
  if (!R) return { tam: 2 ** k0, preliminar: false };
  if (R >= k0) return { tam: 2 ** R, preliminar: false };
  if (R === k0 - 1) return { tam: 2 ** k0, preliminar: true };
  erro(`Com ${n} jogadores a chave precisa de pelo menos ${k0 - 1} rodada(s), além de uma preliminar.`);
}
function chaveEliminacao(t, dupla, R) {
  const jog = t.sorteio, n = jog.length;
  const { tam, preliminar } = tamanhoChave(n, R);
  t.preliminar = preliminar;
  const k = Math.round(Math.log2(tam));
  const seed = s => (s <= n ? jog[s - 1] : BYE); // BYEs contra os primeiros sorteados, nunca BYE x BYE
  const o = ordemSeeds(tam);
  const add = (pid, fase, rodada, a, b) => { t.partidas[pid] = { fase, rodada, a, b, vencedor: null }; t.ordem.push(pid); };
  const fu = dupla ? "upper" : "unica";
  for (let m = 0; m < tam / 2; m++) add(`U1-${m + 1}`, fu, 1, ["J", seed(o[2 * m])], ["J", seed(o[2 * m + 1])]);
  for (let r = 2; r <= k; r++) for (let m = 0; m < tam / 2 ** r; m++) add(`U${r}-${m + 1}`, fu, r, ["V", `U${r - 1}-${2 * m + 1}`], ["V", `U${r - 1}-${2 * m + 2}`]);
  t.k = k;
  if (!dupla) { t.final_id = `U${k}-1`; return; }
  for (let m = 0; m < tam / 4; m++) add(`L1-${m + 1}`, "lower", 1, ["P", `U1-${2 * m + 1}`], ["P", `U1-${2 * m + 2}`]);
  for (let i = 1; i < k; i++) {
    const c = tam / 2 ** (i + 1);
    for (let m = 0; m < c; m++) add(`L${2 * i}-${m + 1}`, "lower", 2 * i, ["V", `L${2 * i - 1}-${m + 1}`], ["P", `U${i + 1}-${c - m}`]); // invertido p/ evitar revanche
    if (i < k - 1) for (let m = 0; m < tam / 2 ** (i + 2); m++) add(`L${2 * i + 1}-${m + 1}`, "lower", 2 * i + 1, ["V", `L${2 * i}-${2 * m + 1}`], ["V", `L${2 * i}-${2 * m + 2}`]);
  }
  add("GF-1", "final", 1, ["V", `U${k}-1`], ["V", `L${2 * k - 2}-1`]);
  add("GF-2", "final", 2, ["V", "GF-1"], ["P", "GF-1"]); // reset: só se quem veio da inferior vencer a GF-1
  t.final_id = "GF-2";
}
function resolver(t, s) {
  const [tipo, v] = s;
  if (tipo === "J") return v;
  const p = t.partidas[v];
  if (p.vencedor == null) return null;
  if (tipo === "V") return p.vencedor;
  const a = resolver(t, p.a), b = resolver(t, p.b);
  return p.vencedor === a ? b : a;
}
function rotulo(t, s) {
  const r = resolver(t, s);
  if (r != null) return r;
  return (s[0] === "V" ? "Vencedor " : "Perdedor ") + s[1];
}
function participantes(t, p) { return p.jogadores ? p.jogadores : [resolver(t, p.a), resolver(t, p.b)]; }
function nomesPartida(t, p) { return p.jogadores ? p.jogadores : [rotulo(t, p.a), rotulo(t, p.b)]; }

// ---------- todos contra todos ----------
// Quantas rodadas (método do círculo) até todo mundo ter pelo menos G jogos de verdade (BYE não conta)
function rodadasParaJogos1x1(nJog, G) {
  if (nJog % 2 === 0) return G;
  let j = Array.from({ length: nJog }, (_, i) => i).concat([-1]);
  const n = j.length, jogos = Array(nJog).fill(0);
  let r = 0;
  while (Math.min(...jogos) < G && r < MAX_RODADAS) {
    for (let m = 0; m < n / 2; m++) { const a = j[m], b = j[n - 1 - m]; if (a >= 0 && b >= 0) { jogos[a]++; jogos[b]++; } }
    j = [j[0], j[n - 1], ...j.slice(1, n - 1)];
    r++;
  }
  return r;
}
const MAX_RODADAS = 60, MAX_CHAVE = 8; // 8 rodadas = chave de 256 vagas
function rodadasTodos(c) {
  const n = c.jogadores.length;
  const lim = x => Math.max(1, Math.min(MAX_RODADAS, x));
  if (c.modo === "1x1") {
    if (c.jogos_por_pessoa) return lim(rodadasParaJogos1x1(n, c.jogos_por_pessoa));
    return lim(c.rodadas || (n % 2 ? n : n - 1)); // padrão: todos se enfrentam uma vez
  }
  // pods: todo mundo joga em toda rodada, então jogos por pessoa = rodadas
  return lim(c.jogos_por_pessoa || c.rodadas || Math.ceil((n - 1) / 3));
}
function roundRobin1x1(t, R) {
  let j = t.sorteio.slice();
  if (j.length % 2) j.push(BYE);
  const n = j.length;
  for (let r = 0; r < R; r++) { // passando de n-1 rodadas, o círculo recomeça (returno)
    for (let m = 0; m < n / 2; m++) {
      const pid = `R${r + 1}-${m + 1}`;
      t.partidas[pid] = { fase: "rr", rodada: r + 1, a: ["J", j[m]], b: ["J", j[n - 1 - m]], vencedor: null };
      t.ordem.push(pid);
    }
    j = [j[0], j[n - 1], ...j.slice(1, n - 1)];
  }
}
function roundRobinPods(t, rodadas) {
  const rng = Rng(`${t.seed}-rr`);
  for (let r = 0; r < rodadas; r++) {
    montarPods(t.sorteio, rng, t.encontros).forEach((pod, m) => {
      const pid = `R${r + 1}-P${m + 1}`;
      t.partidas[pid] = { fase: "rr", rodada: r + 1, jogadores: pod, vencedor: null };
      t.ordem.push(pid);
    });
  }
}

// ---------- eliminação em pods ----------
function gerarRodadaPod(t) {
  t.rodada_atual += 1;
  const r = t.rodada_atual, rng = Rng(`${t.seed}-${r}`);
  const up = t.pools.upper, low = t.pools.lower, tot = up.length + low.length;
  if (tot === 1) { // sobrou um só: a última mesa já decidiu o campeão
    const nome = up.concat(low)[0];
    t.final_id = [...t.ordem].reverse().find(pid => t.partidas[pid].vencedor === nome);
    t.pools = { upper: [], lower: [] };
    return;
  }
  if (tot <= 4) {
    t.partidas["F-1"] = { fase: "final", rodada: r, jogadores: up.concat(low), vencedor: null };
    t.ordem.push("F-1");
    t.final_id = "F-1";
    t.pools = { upper: [], lower: [] };
    return;
  }
  for (const [nome, pool] of [["upper", up], ["lower", low]]) {
    if (pool.length < 3) continue; // aguarda a próxima rodada
    const prefixo = nome === "upper" ? "U" : "L";
    const fase = t.formato === "dupla" ? nome : "unica";
    montarPods(pool, rng, t.encontros).forEach((pod, m) => {
      const pid = `${prefixo}${r}-P${m + 1}`;
      t.partidas[pid] = { fase, rodada: r, jogadores: pod, vencedor: null, pool: nome };
      t.ordem.push(pid);
    });
    t.pools[nome] = [];
  }
}
function avancarPods(t) {
  const r = t.rodada_atual;
  const atuais = t.ordem.map(pid => t.partidas[pid]).filter(p => p.rodada === r);
  if (!atuais.length || atuais.some(p => p.vencedor == null) || t.final_id != null) return;
  for (const p of atuais) {
    const perdedores = p.jogadores.filter(j => j !== p.vencedor);
    t.pools[p.pool].push(p.vencedor);
    if (p.pool === "upper" && t.formato === "dupla") t.pools.lower.push(...perdedores);
    else t.eliminados.push(...perdedores);
  }
  gerarRodadaPod(t);
}

// ---------- atualização / resultados ----------
function atualizar(t) {
  if (t.modo === "1x1") {
    for (const pid of t.ordem) {
      const p = t.partidas[pid];
      if (p.vencedor != null) continue;
      const a = resolver(t, p.a), b = resolver(t, p.b);
      if (a == null || b == null) continue;
      if (a === BYE) { p.vencedor = b; p.auto = true; }
      else if (b === BYE) { p.vencedor = a; p.auto = true; }
      else if (pid === "GF-2") {
        const g = t.partidas["GF-1"];
        if (g.vencedor === resolver(t, g.a)) { p.vencedor = g.vencedor; p.auto = true; p.nao_necessaria = true; }
      }
    }
  } else if (t.formato !== "todos") avancarPods(t);
}
function classificacao(t) {
  const s = {};
  for (const j of t.jogadores) s[j] = { nome: j, pts: 0, v: 0, e: 0, d: 0, jogos: 0, opo: [] };
  for (const pid of t.ordem) {
    const p = t.partidas[pid];
    if (p.vencedor == null) continue;
    const parts = participantes(t, p).filter(x => x !== BYE);
    for (const x of parts) { s[x].jogos++; s[x].opo.push(...parts.filter(y => y !== x)); }
    if (p.vencedor === "empate") { for (const x of parts) { s[x].pts += t.pontos_empate; s[x].e++; } }
    else {
      s[p.vencedor].pts += t.pontos_vitoria; s[p.vencedor].v++;
      for (const x of parts) if (x !== p.vencedor) s[x].d++;
    }
  }
  const linhas = Object.values(s);
  for (const l of linhas) l.forca = l.opo.reduce((acc, o) => acc + s[o].pts, 0);
  return linhas.sort((a, b) => b.pts - a.pts || b.forca - a.forca || b.v - a.v || a.nome.toLowerCase().localeCompare(b.nome.toLowerCase(), "pt"));
}
function campeao(t) {
  if (t.formato === "todos") return t.ordem.every(pid => t.partidas[pid].vencedor != null) ? classificacao(t)[0].nome : null;
  return t.final_id ? t.partidas[t.final_id].vencedor : null;
}

    else if (definidos) st = "pronta";
    else st = "aguardando";
    const foot = t.formato === "todos" && definidos && !p.auto ? `<div class="foot"><button class="link" data-act="venc" data-pid="${esc(pid)}" data-nome="empate">${p.vencedor === "empate" ? "desfazer empate" : "empate"}</button></div>` : "";
    return `<div class="card ${pronta(t, p) ? "ready" : ""}" id="m-${esc(pid)}"><div class="id"><span>${esc(pid)}</span><span class="st">${st}</span></div>${linhas}${foot}</div>`;
  };

  const secoes = ordemFases.map(fase => {
    const rods = Object.keys(porFase[fase]).map(Number).sort((a, b) => a - b);
    if (!rods.length) return "";
    const cols = rods.map(r => `<div class="col"><h4>${esc(nomeColuna(t, fase, r, porFase[fase][r]))}</h4><div class="cards">${porFase[fase][r].map(card).join("")}</div></div>`).join("");
    return `<section class="fase">${mostrarTitulos && tituloFase[fase] ? `<h3>${tituloFase[fase]}</h3>` : ""}<div class="board">${cols}</div></section>`;
  }).join("");

  let tabela = "", aviso = "";
  if (t.formato === "todos") {
    const cl = classificacao(t);
    tabela = `<h2 style="margin-top:8px">Classificação</h2><div class="tblwrap"><table class="cls"><tr><th>#</th><th>Jogador</th><th>Pts</th><th>V-E-D</th><th>Jogos</th><th title="Soma dos pontos dos oponentes">Força oponentes</th></tr>
      ${cl.map((l, i) => `<tr><td>${i + 1}</td><td>${esc(l.nome)}</td><td>${l.pts}</td><td>${l.v}-${l.e}-${l.d}</td><td>${l.jogos}</td><td>${l.forca}</td></tr>`).join("")}</table></div>
      <p class="help">Desempate: pontos → força dos oponentes → vitórias → nome.</p>`;
    if (camp && cl.length > 1 && cl[0].pts === cl[1].pts && cl[0].forca === cl[1].forca && cl[0].v === cl[1].v)
      aviso = `<div class="note">Empate no topo entre ${esc(cl[0].nome)} e ${esc(cl[1].nome)} em todos os critérios. Vale um confronto direto ou uma mesa extra.</div>`;
  }
  let aguardando = "";
  if (t.modo === "pod" && t.formato !== "todos" && !t.final_id) {
    const u = t.pools.upper, l = t.pools.lower;
    if (u.length || l.length) aguardando = `<div class="note">Aguardando a próxima rodada: ${[u.length ? `superior — ${u.map(esc).join(", ")}` : "", l.length ? `inferior — ${l.map(esc).join(", ")}` : ""].filter(Boolean).join(" · ")}</div>`;
  }

  app.innerHTML = `
    <h1>${esc(c.nome)}</h1>
    <div class="muted">${esc(MODOS[c.modo])} · ${esc(FORMATOS[c.formato])} · ${c.jogadores.length} jogadores${t.rodadas_total ? ` · ${t.rodadas_total} rodada(s)${c.jogos_por_pessoa ? ` (${c.jogos_por_pessoa} jogo(s) por pessoa)` : ""}` : ""}${t.k ? ` · chave de ${2 ** (t.preliminar ? t.k - 1 : t.k)} vagas${t.preliminar ? " + preliminar" : ""}` : ""} · sorteio nº ${esc(c.seed)}</div>
    <div class="toolbar">
      <button class="btn" data-act="desfazer" ${atual.resultados.length ? "" : "disabled"}>↶ Desfazer último</button>
      <button class="btn" data-act="link">Copiar link</button>
      <button class="btn" data-act="imprimir">Imprimir</button>
      <button class="btn" data-act="editar">Editar opções</button>
      <button class="btn" data-act="home">Novo torneio</button>
    </div>
    ${camp ? `<div class="champ">🏆 Campeão: ${esc(camp)}</div>` : ""}
    ${aviso}${aguardando}
    ${Object.keys(autos).length && t.formato !== "todos" ? `<div class="note">Avançaram sem jogar (vitória automática): ${Object.entries(autos).map(([n, q]) => esc(n) + (q > 1 ? ` (${q}×)` : "")).join(", ")}</div>` : ""}
    ${!camp && prontas.length ? `<div class="muted" style="font-size:13px;margin-bottom:6px">Prontas para jogar — toque no nome de quem venceu:</div>
      <div class="prontas">${prontas.map(pid => `<button class="chip" data-act="ir" data-pid="${esc(pid)}"><b>${esc(pid)}</b>${participantes(t, t.partidas[pid]).map(esc).join(" vs ")}</button>`).join("")}</div>` : ""}
    ${secoes}
    ${tabela}
    <details class="sorteio"><summary>Ordem do sorteio</summary><p>${t.sorteio.map((n, i) => `${i + 1}. ${esc(n)}`).join(" · ")}</p></details>`;
}

// ---------- eventos ----------
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "home") return telaInicial();
  if (act === "cancelarEdicao") { const id = edicao; edicao = null; return abrir(id); }
  if (act === "abrir") return abrir(b.dataset.id);
  if (act === "excluir") {
    const s = db.torneios[b.dataset.id];
    if (s && confirm(`Excluir “${s.config.nome}” deste navegador?`)) { delete db.torneios[b.dataset.id]; salvarDB(); telaInicial(); }
    return;
  }
  if (!atual) return;
  if (act === "editar") return editarTorneio();
  if (act === "venc") return definir(b.dataset.pid, b.dataset.nome);
  if (act === "desfazer") { atual.resultados.pop(); const r = reconstruir(atual.config, atual.resultados); atual.t = r.t; atual.resultados = r.validos; persistir(); render(); return toast("Último resultado desfeito"); }
  if (act === "imprimir") return window.print();
  if (act === "link") {
    persistir();
    const url = location.href;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast("Link copiado — quem abrir vê a chave atual")).catch(() => prompt("Copie o link:", url));
    return;
  }
  if (act === "ir") {
    const el = document.getElementById("m-" + b.dataset.pid);
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400); }
  }
});

// ---------- início ----------
(function iniciar() {
  const m = location.hash.match(/^#d=(.+)$/);
  if (m) {
    try {
      const o = dec(m[1]);
      if (o && o.c && Array.isArray(o.c.jogadores) && Array.isArray(o.r)) {
        criar(o.c); // valida
        const local = db.torneios[o.c.id];
        const igual = local && JSON.stringify(local.resultados) === JSON.stringify(o.r);
        if (!local || igual || confirm("Este link tem uma versão diferente de um torneio que você já salvou aqui. Substituir pela versão do link?"))
          db.torneios[o.c.id] = { config: o.c, resultados: o.r, atualizado: Date.now() };
        salvarDB();
        return abrir(o.c.id);
      }
    } catch (e) { /* link inválido: segue para a tela inicial */ }
  }
  if (db.atual && db.torneios[db.atual]) return abrir(db.atual);
  telaInicial();
})();
</script>
</body>

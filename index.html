<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNTAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1e8;--panel:#fffdf8;--ink:#1f1b16;--muted:#6f675b;--line:#e2d9c8;--accent:#a4471f}
@media (prefers-color-scheme:dark){:root{--bg:#15130f;--panel:#1d1a15;--ink:#efe8dc;--muted:#a69d8e;--line:#3a342b;--accent:#e08a5c}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px}
main{max-width:480px;width:100%}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:44px;margin:0 0 4px;letter-spacing:.01em}
h1 span{color:var(--accent)}
p{color:var(--muted);margin:0 0 28px}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;color:var(--ink);text-decoration:none;transition:border-color .2s}
a.card:hover{border-color:var(--accent)}
a.card b{display:block;font-size:17px}
a.card small{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>dntab<span>.</span></h1>
  <p>Ferramentas para jogar Magic.</p>
  <a class="card" href="/chave/">
    <b>Chaveamento de Magic →</b>
    <small>Torneios 1x1 ou pods de Commander: eliminação simples, dupla ou todos contra todos.</small>
  </a>
</main>
</body>
</html>

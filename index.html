<title>Bem-vindo · dntab</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('dntab-tema'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
    document.documentElement.setAttribute('data-tema', t);
  })();
</script>
<style>
  :root { --fundo:#0e0c12; --superficie:#18151f; --borda:#2f2a3a; --texto:#ece6d8; --suave:#9d95a8; --destaque:#c9a24a; --destaque-texto:#1a1408; --perigo:#e07a6e;
    --brilho: radial-gradient(1200px 600px at 50% -10%, rgba(201,162,74,.16), transparent 60%); color-scheme: dark; }
  [data-tema="claro"] { --fundo:#f4f0e8; --superficie:#fff; --borda:#ddd5c6; --texto:#1e1a24; --suave:#6c6476; --destaque:#8b6a1e; --destaque-texto:#fff; --perigo:#b8463a;
    --brilho: radial-gradient(1200px 600px at 50% -10%, rgba(139,106,30,.14), transparent 60%); color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--brilho), var(--fundo); color: var(--texto); min-height: 100vh; display: grid; place-items: center; padding: 20px;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .caixa { width: 100%; max-width: 380px; text-align: center; }
  .caixa[hidden] { display: none; }
  .marca { font-family: Georgia, serif; letter-spacing: .08em; color: var(--suave); margin-bottom: 28px; }
  .marca b { color: var(--destaque); font-weight: normal; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: normal; font-size: clamp(2.6rem, 9vw, 4.2rem); line-height: 1.05; margin: 0 0 8px; }
  h1 .ornamento { display: block; color: var(--destaque); font-size: .35em; letter-spacing: .5em; margin-bottom: 14px; }
  .sub { color: var(--suave); margin: 0 0 24px; }
  form { background: var(--superficie); border: 1px solid var(--borda); border-radius: 14px; padding: 22px; text-align: left; display: grid; gap: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  label { display: grid; gap: 5px; font-size: .88rem; color: var(--suave); }
  input[type="password"] { width: 100%; font: inherit; color: var(--texto); background: var(--fundo); border: 1px solid var(--borda); border-radius: 8px; padding: 10px 12px; }
  input:focus, button:focus-visible { outline: 2px solid var(--destaque); outline-offset: 1px; }
  .lembrar { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  button { font: inherit; border: 0; background: var(--destaque); color: var(--destaque-texto); font-weight: 600; padding: 11px; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { color: var(--perigo); font-size: .88rem; min-height: 1.3em; margin: 0; }
  .rodape { margin-top: 18px; font-size: .85rem; }
  .rodape a { color: var(--destaque); }
</style>
</head>
<body>
<div class="caixa" id="abrindo"><p class="sub">Abrindo…</p></div>
<div class="caixa" id="porta" hidden>
  <div class="marca"><b>dn</b>tab</div>
  <h1><span class="ornamento">✦ ✦ ✦</span>Bem-vindo</h1>
  <p class="sub">Digite a senha para entrar.</p>
  <form id="form" autocomplete="on">
    <input type="text" name="username" value="dntab.com.br" autocomplete="username" hidden>
    <label>Senha <input type="password" id="senha" autocomplete="current-password" required autofocus></label>
    <label class="lembrar"><input type="checkbox" id="lembrar"> Lembrar neste aparelho</label>
    <p class="msg" id="msg" role="alert"></p>
    <button type="submit" id="botao">Entrar</button>
  </form>
  
</div>

  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function b64(a) { var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function ler() { try { return sessionStorage.getItem(CHAVE) || localStorage.getItem(CHAVE); } catch (e) { return null; } }
  function esquecer() { try { sessionStorage.removeItem(CHAVE); localStorage.removeItem(CHAVE); } catch (e) {} }
  function guardar(v, lembrar) {
    try { sessionStorage.setItem(CHAVE, v); if (lembrar) localStorage.setItem(CHAVE, v); } catch (e) {}
  }
  function mostrarPorta(msg) {
    document.getElementById('abrindo').hidden = true;
    document.getElementById('porta').hidden = false;
    document.getElementById('msg').textContent = msg || '';
    document.getElementById('senha').focus();
  }
  var sub = window.crypto && crypto.subtle;
  function abrir(chaveB64) {
    return sub.importKey('raw', bytes(chaveB64), 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return sub.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, k, bytes(DADOS)); })
      .then(function (claro) {
        var pagina = new TextDecoder().decode(claro);
        // Só troca o conteúdo depois que esta página terminou de carregar
        return new Promise(function (ok) {
          function trocar() { document.open(); document.write(pagina); document.close(); ok(); }
          if (document.readyState === 'complete') setTimeout(trocar, 0);
          else window.addEventListener('load', function () { setTimeout(trocar, 0); });
        });
      });
  }
  function derivar(senha) {
    return sub.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) { return sub.deriveBits({ name: 'PBKDF2', salt: bytes(SAL), iterations: ITER, hash: 'SHA-256' }, base, 256); })
      .then(function (bits) { return b64(new Uint8Array(bits)); });
  }

  if (!sub) {
    mostrarPorta('Este navegador não consegue abrir páginas protegidas. Use Chrome, Edge, Firefox ou Safari atualizados.');
    document.getElementById('botao').disabled = true;
    return;
  }

  var salva = ler();
  if (salva) abrir(salva).catch(function () { esquecer(); mostrarPorta(); });
  else mostrarPorta();

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var botao = document.getElementById('botao'), senha = document.getElementById('senha').value;
    var lembrar = document.getElementById('lembrar').checked;
    if (!senha) return;
    botao.disabled = true; botao.textContent = 'Verificando…';
    document.getElementById('msg').textContent = '';
    var chaveOk = null;
    derivar(senha).then(function (chave) {
      chaveOk = chave;
      return abrir(chave);
    }).then(function () {
      guardar(chaveOk, lembrar);
    }, function () {
      botao.disabled = false; botao.textContent = 'Entrar';
      document.getElementById('msg').textContent = 'Senha incorreta.';
      document.getElementById('senha').select();
    });
  });
})();
